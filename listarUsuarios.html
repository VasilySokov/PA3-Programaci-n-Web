      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">PA3</a>

        <!-- Hidden Checkbox State -->
        <input type="checkbox" id="nav-toggle" class="d-none" />

        <!-- Toggler Button (Label tied to checkbox) -->
        <label for="nav-toggle" class="navbar-toggler" role="button">
          <span class="navbar-toggler-icon"></span>
        </label>

        <!-- Nav Links -->
        <div class="collapse navbar-collapse" id="nav-menu">
          <ul class="navbar-nav ms-auto mb-2 mb-md-0">
            <li class="nav-item">
              <a class="nav-link active" href="./index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./listarUsuarios.html"
                >Listar Usuario</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./registrarUsuario.html"
                >Registrar Usuarios</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./reporteUsuario.html">Reporte</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Button trigger modal
    <button
      type="button"
      class="btn btn-primary"
      data-toggle="modal"
      data-target="#modalActualizar"
    >
      Launch demo modal
    </button> -->

    <!-- Modal -->
    <!-- Modal -->
    <div
      class="modal fade"
      id="modalActualizar"
      tabindex="-1"
      role="dialog"
      aria-labelledby="exampleModalCenterTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
          <div class="modal-header text-center">
            <h5 class="modal-title" id="">Actualización de Productos</h5>
          </div>
          <div class="modal-body">
            <h5 id="idModal"></h5>
            <div class="container">
              <form id="modalForm">
                <input
                  class="mt-3"
                  type="text"
                  placeholder="Ingrese Nombre Usuario"
                  id="nombreModal"
                  name="nombre"
                />
                <input
                  class="mt-3"
                  type="text"
                  placeholder="Ingrese Contraseña"
                  id="contrasenaModal"
                  name="contrasena"
                />
                <input
                  class="mt-3"
                  type="email"
                  placeholder="Ingrese Correo electrónico"
                  id="correoModal"
                  name="correo"
                />
              </form>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              onclick="ActualizarDatos()"
              class="btn btn-primary"
            >
              Actualizar
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="table-responsive-md mt-5 px-5">
      <h1 class="text-center pb-5">Tabla de Usuarios</h1>
      <br />
      <table class="table table-dark" id="tablaDatos"></table>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/scriptUsuario.js" defer></script>
  </body>
</html>
