<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <!-- Button trigger modal
    <button
      type="button"
      class="btn btn-primary"
      data-toggle="modal"
      data-target="#modalActualizar"
    >
      Launch demo modal
    </button> -->

    <!-- Modal -->
    <!-- Modal -->
    <div
      class="modal fade"
      id="modalActualizar"
      tabindex="-1"
      role="dialog"
      aria-labelledby="exampleModalCenterTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
          <div class="modal-header text-center">
            <h5 class="modal-title" id="">Actualización de Productos</h5>
          </div>
          <div class="modal-body">
            <h5 id="idModal"></h5>
            <div class="container">
              <form id="modalForm">
                <input
                  class="mt-3"
                  type="text"
                  placeholder="Ingrese Nombre"
                  id="nombreModal"
                  name="nombre"
                />
                <input
                  class="mt-3"
                  type="number"
                  step="0.01"
                  placeholder="Ingrese Precio"
                  id="precioModal"
                  name="precio"
                />
                <input
                  class="mt-3"
                  type="number"
                  placeholder="Ingrese Stock"
                  id="stockModal"
                  name="stock"
                />
              </form>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              onclick="ActualizarDatos()"
              class="btn btn-primary"
            >
              Actualizar
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="container-sm">
      <h1>Ingresar Datos</h1>
      <form id="formRegistrar">
        <input type="text" name="nombre" placeholder="Nombre" />
        <input type="number" step="0.01" name="precio" placeholder="Precio" />
        <input type="number" name="stock" placeholder="Stock" />
        <button class="btn btn-info" type="submit">Guardar</button>
      </form>
    </div>

    <div class="table-responsive-md mt-5 px-5">
      <h1 class="text-center pb-5">Tabla de Productos</h1>
      <table class="table table-dark" id="tablaDatos"></table>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/script.js"></script>
  </body>
</html>
